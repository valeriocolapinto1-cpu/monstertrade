[project]
name = "monstertrade-backend"
version = "0.1.0"
description = "Backend di analisi e proposte di trade (uso personale)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "defusedxml==0.7.1",
    "exchange-calendars==4.13.2",
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.5",
    "uvicorn[standard]==0.54.0",
    "vectorbt==1.1.2",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
# FinBERT gira solo nei job pianificati (GitHub Actions), non nell'API su Render.
ml = [
    "torch==2.14.1",
    "transformers==5.20.1",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "ta==0.11.0",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["yfinance", "exchange_calendars", "vectorbt", "ta", "ta.*", "transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
