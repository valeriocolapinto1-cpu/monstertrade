[project]
name = "monstertrade-backend"
version = "0.1.0"
description = "Backend di analisi e proposte di trade (uso personale)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
