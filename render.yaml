# Blueprint Render per l'API (piano gratuito). Le variabili segrete si impostano
# nel pannello di Render, mai qui.
services:
  - type: web
    name: monstertrade-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install uv==0.11.32 && uv sync --frozen --no-dev
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
