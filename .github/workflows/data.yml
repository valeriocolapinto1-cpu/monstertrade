name: Aggiornamento dati

on:
  schedule:
    # Ogni 30 minuti: crypto e intraday. Le giornaliere si completano dopo la chiusura USA.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Prezzi, indicatori, score, proposte e qualità
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Database configurato?
        id: check
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL non impostata: aggiornamento saltato."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.check.outputs.skip != 'true'
        run: uv sync --frozen --no-dev
      - if: steps.check.outputs.skip != 'true'
        name: Migrazioni
        run: uv run --no-dev alembic upgrade head
      - if: steps.check.outputs.skip != 'true'
        name: Aggiornamento prezzi
        run: uv run --no-dev python -m app.jobs.prices update
      - if: steps.check.outputs.skip != 'true'
        name: Indicatori
        run: uv run --no-dev python -m app.jobs.indicators
      - if: steps.check.outputs.skip != 'true'
        name: Score e segnali
        run: uv run --no-dev python -m app.jobs.signals
      - if: steps.check.outputs.skip != 'true'
        name: Proposte e simulazione
        env:
          CAPITAL_EUR: ${{ vars.CAPITAL_EUR || '1000' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Con le chiavi (sola lettura) le proposte usano il rischio del conto reale.
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ vars.T212_ENV || 'live' }}
        run: uv run --no-dev python -m app.jobs.trading
      - if: steps.check.outputs.skip != 'true'
        name: Controllo qualità
        run: uv run --no-dev python -m app.jobs.prices quality > "$RUNNER_TEMP/quality.json" || echo "::warning::Dati incompleti, vedi rapporto"
