name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type check, test, audit, SAST)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monstertrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monstertrade_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrazioni
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic downgrade base
      - name: Test
        run: uv run pytest -q
      - name: Analisi statica di sicurezza (bandit)
        run: uv run bandit -q -c pyproject.toml -r app
      - name: Audit dipendenze (pip-audit)
        run: |
          uv export --frozen --no-emit-project --all-groups -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --strict
      - name: Audit dipendenze ML (FinBERT)
        run: |
          # torch arriva dall'indice CPU di PyTorch (versione "+cpu"): si verifica a parte su PyPI.
          uv export --frozen --no-emit-project --all-groups --all-extras --no-emit-package torch -o "$RUNNER_TEMP/ml.txt"
          uv run pip-audit -r "$RUNNER_TEMP/ml.txt" --disable-pip --require-hashes --strict
          grep -E '^    "torch==' pyproject.toml | tr -d ' ",' > "$RUNNER_TEMP/torch.txt"
          uv run pip-audit -r "$RUNNER_TEMP/torch.txt" --disable-pip --no-deps --strict

  frontend:
    name: Frontend (lint, type check, test, audit, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      # Dipendenze di produzione: nessuna vulnerabilità ammessa.
      # Strumenti di sviluppo: blocco sulle critiche (vedi docs/sicurezza.md).
      - name: Audit dipendenze
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=critical
      - name: Build
        run: npm run build

  secrets:
    name: Scansione dei segreti (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
