name: Sentiment

on:
  schedule:
    # Ogni 2 ore: notizie, StockTwits e Fear and Greed, con FinBERT in locale.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      history:
        description: "Scarica tutto lo storico del Fear and Greed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentiment
  cancel-in-progress: false

jobs:
  sentiment:
    name: Sentiment con FinBERT
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      HF_HOME: ${{ github.workspace }}/.hf
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Database configurato?
        id: check
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL non impostata: sentiment saltato."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.check.outputs.skip != 'true'
        name: Cache del modello FinBERT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf
          # Revisione del modello fissata in app/sentiment/scorer.py (FINBERT_REVISION).
          key: finbert-${{ hashFiles('backend/app/sentiment/scorer.py') }}
      - if: steps.check.outputs.skip != 'true'
        run: uv sync --frozen --no-dev --extra ml
      - if: steps.check.outputs.skip != 'true'
        name: Raccolta e classificazione
        env:
          HISTORY: ${{ inputs.history && '--history' || '' }}
        run: uv run --no-dev --extra ml python -m app.jobs.sentiment $HISTORY
